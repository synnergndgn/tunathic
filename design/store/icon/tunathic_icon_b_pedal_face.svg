<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="Tunathic app icon: pedal tuner faceplate">
  <title>Tunathic icon: Pedal Face</title>
  <desc>Concept B. A pedal-tuner front panel in ivory enamel: two hardware
  screws, a row of indicator lamps with the centre one lit green, and a sunken
  display window carrying the detected note in warm orange.</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#FFFDF8"/>
      <stop offset="0.5"  stop-color="#F8F1E7"/>
      <stop offset="1"    stop-color="#EDE0CF"/>
    </linearGradient>

    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0.5" x2="8" y2="0.5" stroke="#6B4A32" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#3B322C"/>
      <stop offset="0.45" stop-color="#2C2521"/>
      <stop offset="1"    stop-color="#221C19"/>
    </linearGradient>

    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="screw" cx="0.34" cy="0.30" r="0.85">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C3AE99"/>
      <stop offset="1"   stop-color="#6B5748"/>
    </radialGradient>

    <radialGradient id="lampOn" cx="0.35" cy="0.30" r="0.9">
      <stop offset="0"   stop-color="#B9E4C7"/>
      <stop offset="0.5" stop-color="#35734C"/>
      <stop offset="1"   stop-color="#1E4630"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#plate)"/>
  <rect width="512" height="512" fill="url(#grain)"/>

  <rect x="24" y="24" width="464" height="464" rx="26"
        fill="none" stroke="#D9C9B8" stroke-width="2"/>
  <rect x="27.5" y="27.5" width="457" height="457" rx="23"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5"/>

  <!-- Hardware screws, the app's own faceplate detail -->
  <g>
    <circle cx="76" cy="76" r="16" fill="#5A3A24" fill-opacity="0.18" transform="translate(2,3)"/>
    <circle cx="76" cy="76" r="16" fill="url(#screw)"/>
    <line x1="66" y1="76" x2="86" y2="76" stroke="#4A3B31" stroke-opacity="0.55" stroke-width="3.5"/>
    <circle cx="436" cy="76" r="16" fill="#5A3A24" fill-opacity="0.18" transform="translate(2,3)"/>
    <circle cx="436" cy="76" r="16" fill="url(#screw)"/>
    <line x1="426" y1="76" x2="446" y2="76" stroke="#4A3B31" stroke-opacity="0.55" stroke-width="3.5"/>
  </g>

  <!-- Indicator lamps. Only the centre one is lit: that is what in tune means. -->
  <g>
    <circle cx="136" cy="152" r="11" fill="#D5C3AE"/>
    <circle cx="196" cy="152" r="11" fill="#D5C3AE"/>
    <circle cx="256" cy="152" r="17" fill="#35734C" fill-opacity="0.16"/>
    <circle cx="256" cy="152" r="13" fill="url(#lampOn)"/>
    <circle cx="316" cy="152" r="11" fill="#D5C3AE"/>
    <circle cx="376" cy="152" r="11" fill="#D5C3AE"/>
  </g>

  <!-- Sunken display window -->
  <rect x="72" y="202" width="368" height="192" rx="18" fill="#5A3A24" fill-opacity="0.22"/>
  <rect x="76" y="204" width="360" height="184" rx="16" fill="url(#glass)"/>
  <rect x="76" y="204" width="360" height="184" rx="16" fill="url(#glassSheen)"/>
  <rect x="76" y="204" width="360" height="184" rx="16"
        fill="none" stroke="#B99F88" stroke-width="3"/>

  <!-- The detected note, set the way the app sets it: monospace, very large -->
  <text x="256" y="296" fill="#E1842F"
        font-family="Consolas, 'SF Mono', 'Roboto Mono', 'Courier New', monospace"
        font-size="168" font-weight="800" letter-spacing="-4"
        text-anchor="middle" dominant-baseline="central">E</text>

  <!-- Lower hardware, so the panel reads as a whole object -->
  <g>
    <circle cx="76" cy="438" r="16" fill="url(#screw)"/>
    <line x1="66" y1="438" x2="86" y2="438" stroke="#4A3B31" stroke-opacity="0.55" stroke-width="3.5"/>
    <circle cx="436" cy="438" r="16" fill="url(#screw)"/>
    <line x1="426" y1="438" x2="446" y2="438" stroke="#4A3B31" stroke-opacity="0.55" stroke-width="3.5"/>
  </g>
</svg>
